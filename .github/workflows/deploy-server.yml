name: Build and Deploy Server

# Manual deployment until the production target and branch policy are confirmed.
on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending Yoyo migrations before activation (enabled by default; required for first deployment)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: hkhub-server-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload source, build on server and activate API
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load public deployment configuration
        id: target
        shell: bash
        run: |
          set -euo pipefail
          . ./.env.prod
          [[ "$SERVER_HOST" != your-server-host && "$SERVER_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] || {
            printf 'Configure SERVER_HOST in .env.prod\n' >&2; exit 1;
          }
          [[ "$SERVER_USER" != your-server-user && "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || {
            printf 'Configure SERVER_USER in .env.prod\n' >&2; exit 1;
          }
          [[ -n "$SERVER_SSH_KNOWN_HOSTS" ]] || {
            printf 'Set a verified SERVER_SSH_KNOWN_HOSTS entry in .env.prod\n' >&2; exit 1;
          }
          printf 'host=%s\nuser=%s\n' "$SERVER_HOST" "$SERVER_USER" >> "$GITHUB_OUTPUT"

      - name: Archive committed source (never local credentials)
        shell: bash
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git archive --format=tar HEAD \
            .env.prod .dockerignore Dockerfile pyproject.toml app db/migrations \
            docker-compose.prod.yml scripts/deploy-server.sh \
            | gzip -c > "$RUNNER_TEMP/hkhub-server-runtime-$release_id.tar.gz"

      - name: Upload and build on production host
        shell: bash
        env:
          SERVER_HOST: ${{ steps.target.outputs.host }}
          SERVER_USER: ${{ steps.target.outputs.user }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$SERVER_SSH_KEY" && -n "$DATABASE_URL" && -n "$POSTGRES_PASSWORD" ]] || {
            printf 'Configure SERVER_SSH_KEY, DATABASE_URL and POSTGRES_PASSWORD in GitHub Actions Secrets\n' >&2; exit 1;
          }
          # Only load the public host-key entry, never source secret values as shell code.
          SERVER_SSH_KNOWN_HOSTS="$( . ./.env.prod; printf '%s' "$SERVER_SSH_KNOWN_HOSTS" )"
          release_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key_dir="$RUNNER_TEMP/hkhub-ssh-$release_id"
          archive="$RUNNER_TEMP/hkhub-server-runtime-$release_id.tar.gz"
          remote_archive="/tmp/hkhub-server-runtime-$release_id.tar.gz"
          runtime_dir="/srv/apps/hkhub/prod/server/api/incoming/$release_id"
          mkdir -p "$key_dir"
          trap 'rm -rf "$key_dir"; rm -f "$archive"' EXIT
          printf '%s\n' "$SERVER_SSH_KEY" > "$key_dir/id"
          printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          # JSON preserves special characters. The payload travels over SSH stdin, not in arguments/archive.
          python3 -c 'import json, os, sys; json.dump({"DATABASE_URL": os.environ["DATABASE_URL"], "POSTGRES_PASSWORD": os.environ["POSTGRES_PASSWORD"], "DEEPSEEK_API_KEY": os.environ.get("DEEPSEEK_API_KEY", "")}, sys.stdout)' > "$key_dir/secrets.json"
          chmod 600 "$key_dir/id" "$key_dir/known_hosts" "$key_dir/secrets.json"
          ssh_options=(-i "$key_dir/id" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$key_dir/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          scp "${ssh_options[@]}" -P 22 "$archive" "$SERVER_USER@$SERVER_HOST:$remote_archive"
          ssh "${ssh_options[@]}" -p 22 "$SERVER_USER@$SERVER_HOST" \
            "set -eu; umask 077; mkdir -p '$runtime_dir'; tar -xzf '$remote_archive' -C '$runtime_dir'; rm -f '$remote_archive'; bash '$runtime_dir/scripts/deploy-server.sh' '$release_id' '$APPLY_MIGRATIONS'; rm -rf '$runtime_dir'" \
            < "$key_dir/secrets.json"
