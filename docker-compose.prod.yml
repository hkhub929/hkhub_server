# API, unified background worker and PostgreSQL share a private default network.
services:
  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    env_file:
      - ${SERVER_ENV_FILE:?SERVER_ENV_FILE is required}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    ports:
      - "127.0.0.1:${API_HOST_PORT:?API_HOST_PORT is required}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:8000' + os.environ.get('API_PREFIX', '/api') + '/health/ready', timeout=5)"
      interval: 5s
      timeout: 6s
      start_period: 10s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    command: ["python", "-m", "app.worker"]
    env_file:
      - ${SERVER_ENV_FILE:?SERVER_ENV_FILE is required}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 180s
    # Check every supervised child, not just the container's main process.
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    # Keep the major version stable; upgrades require a separate data migration.
    image: postgres:16-bookworm
    env_file:
      - ${POSTGRES_ENV_FILE:?POSTGRES_ENV_FILE is required}
    volumes:
      - type: bind
        source: /srv/data/hkhub/prod/shared/postgresql/data
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    # No published port: only this project's containers access postgres:5432.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    healthcheck:
      # TCP becomes available only after the image's temporary init server exits.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
